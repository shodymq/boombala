# Shared proxy settings. Included by both virtual hosts.
# The identity of the client is written HERE and nowhere else: whatever the visitor sent in these headers is thrown away.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host "";
proxy_set_header Forwarded "";
proxy_set_header X-Vercel-Forwarded-For "";
proxy_set_header X-Vercel-Trusted-Oidc-Idp-Token "";
proxy_set_header Connection "";
proxy_read_timeout 30s;
proxy_send_timeout 30s;
proxy_connect_timeout 3s;
proxy_hide_header X-Powered-By;
